<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO MU Scrolling Banner</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  .banner {
    width: 100%;
    height: 80px;
    background: #ed1c24;
    color: white;
    display: flex;
    align-items: center;
    overflow: hidden;
    white-space: nowrap;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 38px;
    font-weight: 900;
    text-transform: uppercase;
    border-top: 3px solid white;
    border-bottom: 3px solid white;
  }

  .track {
    display: inline-flex;
    flex-shrink: 0;
    animation: scroll 14s linear infinite;
  }

  .item {
    display: inline-block;
    padding-right: 90px;
  }

  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="track">
      <span class="item">🔥 WEBSITE: WWW.NEOMU.COM 🔥 &nbsp; | &nbsp; NEO MU SEASON 6</span>
      <span class="item">🔥 WEBSITE: WWW.NEOMU.COM 🔥 &nbsp; | &nbsp; NEO MU SEASON 6</span>
    </div>
  </div>
</body>
</html>
